<!DOCTYPE html>

<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html, body {

    margin: 0;

    width: 100%;

    height: 100%;

    background: black;

    overflow: hidden;

}

img {

    width: 100%;

    height: 100%;

    object-fit: contain;

}

</style>

</head>

<body>

<img id="slide" src="image1.jpg">

<script>

const images = [

    "image1.jpg",

    "image2.jpg",

    "image3.jpg"

];

let current = 0;

setInterval(function() {

    current = (current + 1) % images.length;

    document.getElementById("slide").src = images[current];

}, 5000);

</script>

</body>

</html>
