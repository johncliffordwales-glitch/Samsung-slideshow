<!DOCTYPE html>

<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    html, body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      background: black;

      overflow: hidden;

    }

    img {

      width: 100%;

      height: 100%;

      object-fit: contain;

    }

  </style>

</head>

<body>

  <img id="slideshow" src="26601ab3-b5d9-4bcc-861b-e1cb26cd79ff.jpeg">

  <script>

    const pictures = [

      "26601ab3-b5d9-4bcc-861b-e1cb26cd79ff.jpeg",

      "3f065a62-583e-4dab-8d04-5c264a916a6d.jpeg",

      "62262c60-95ec-4d52-ba84-711602268e27.jpeg",

      "6a3cd825-c89e-4c88-9a48-e0b9f4f0ec7b.jpeg",

      "85e70b0c-a25e-4697-9154-6d1755db278f.jpeg",

      "8d83d2f1-a161-426f-a9fc-e34ad0fa4f47.jpeg",

      "IMG_5238.jpeg",

      "af44498e-4420-4bbc-9c3f-1832260c4289.jpeg",

      "ea3cc39d-8203-4fe3-bd58-c4856b98efe6.jpeg"

    ];

    let current = 0;

    setInterval(() => {

      current = (current + 1) % pictures.length;

      document.getElementById("slideshow").src = pictures[current];

    }, 10000);

  </script>

</body>

</html>
